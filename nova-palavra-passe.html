<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#FFFFFF">
<title>Nova palavra-passe · Shutter</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Inter+Tight:wght@400;600&display=swap">
<style>
:root { --ink:#141419; --coral:#FF5A3C; --coral-text:#D2351F; --fg:#141419; --dim:#5C5C66; --rule:#E4E4E9; color-scheme: light; }
body { margin:0; background:#FFFFFF; color:var(--fg); font:17px/1.65 "Inter Tight", system-ui, sans-serif; }
main { max-width:720px; margin:0 auto; padding-block:40px 80px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
h1, h2 { font-family:"Unbounded", sans-serif; letter-spacing:-.03em; line-height:1.15; }
h1 { font-size:2rem; } h2 { font-size:1.2rem; margin-top:2.2em; }
p, li { color:var(--dim); } strong { color:var(--fg); }
.draft { border:1px solid var(--coral); border-radius:12px; padding:12px 16px; color:var(--fg); }
a { color:var(--fg); }
.back { display:inline-block; margin-bottom:24px; color:var(--dim); text-decoration:none; }

.btn { display:inline-flex; align-items:center; justify-content:center; min-height:52px; padding:0 26px; border-radius:999px; background:var(--coral); color:var(--ink); font-weight:600; text-decoration:none; margin:18px 0 8px; }
.ok { width:56px; height:56px; border-radius:50%; background:#FFF0ED; color:var(--coral-text); display:grid; place-items:center; font-size:28px; margin-bottom:18px; }
</style></head><body><main>
<a class="back" href="./">← Shutter</a>
<h1 id="t">Define a nova palavra-passe na app.</h1>
<p id="d">Toca no botão para abrir a Shutter e escolher a nova palavra-passe.</p>
<a class="btn" id="go" href="shutter://reset-password">Abrir a Shutter</a>
<p>Este link tem de ser aberto no telemóvel onde tens a app instalada. Se estás no computador, abre o email no telemóvel.</p>
<script>
// Passa o código de recuperação que vem no endereço para a app.
var hash = location.hash || '', search = location.search || '';
var q = new URLSearchParams(hash.slice(1) + '&' + search.slice(1));
if (q.get('error')) {
  document.getElementById('t').textContent = 'Este link já não é válido.';
  document.getElementById('d').textContent = 'O link expirou ou já foi usado. Abre a app e pede outro em "Esqueci-me da palavra-passe".';
  document.getElementById('go').href = 'shutter://login';
} else {
  document.getElementById('go').href = 'shutter://reset-password' + search + hash;
}
</script>
</main></body></html>
